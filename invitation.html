<!DOCTYPE html>
<html>
<body>

<script>

const guests = {

"marco":{
companions:[
"Marco Ayrton Medinacelli",
"Aila Abulencia"
]
},

"gian":{
companions:[
"Gian Carlo Bonto",
"Austine Timkang",
"Jacob Bonto"
]
}

};

// Kunin ang guest mula sa URL
// halimbawa: invitation.html?guest=jacob

const params = new URLSearchParams(window.location.search);

const search =
(params.get("guest") || "")
.trim()
.toLowerCase();

let data = null;

// Search sa key (marco, gian, etc.)
if(guests[search]){
    data = guests[search];
}

// Search sa lahat ng pangalan ng companions
if(!data){

    for(const key in guests){

        const invitation = guests[key];

        const found = invitation.companions.some(person => {

            const fullName =
            person.toLowerCase().trim();

            const words =
            fullName.split(" ");

            return (

                fullName === search ||

                fullName.includes(search) ||

                words.includes(search)

            );

        });

        if(found){

            data = invitation;
            break;

        }

    }

}

if(data){

    console.log("Invitation Found");
    console.log(data);

}else{

    console.log("Invitation Not Found");

}

</script>

</body>
</html>
