<!DOCTYPE html>
<html>
<body>

<script>

const guests = {

"marco":{
companions:[
"Marco Ayrton Medinacelli",
"Aila Abulencia"
]
},

"gian":{
companions:[
"Gian Carlo Bonto",
"Austine Timkang",
"Jacob Bonto"
]
}

};

const params = new URLSearchParams(window.location.search);

const search =
(params.get("guest") || "")
.trim()
.toLowerCase();

let data = null;

/* Search sa main key */
if (guests[search]) {
    data = guests[search];
}

/* Search sa lahat ng pangalan */
if (!data) {

    for (const key in guests) {

        const invitation = guests[key];

        const found = invitation.companions.some(person => {

            const fullName =
            person.toLowerCase().trim();

            const words =
            fullName.split(/\s+/);

            return (

                // exact full name
                fullName === search ||

                // first name, last name, middle name
                words.includes(search) ||

                // partial search
                fullName.includes(search)

            );

        });

        if (found) {
            data = invitation;
            break;
        }
    }
}

if (data) {

    document.body.innerHTML =
    "<h1>Invitation Found</h1><pre>" +
    JSON.stringify(data, null, 2) +
    "</pre>";

} else {

    document.body.innerHTML =
    "<h1>Invitation Not Found</h1>";

}

</script>

</body>
</html>
