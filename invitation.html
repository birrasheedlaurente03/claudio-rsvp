    max-width:600px;

    background:white;

    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);

    text-align:center;

.checkbox{

.checkbox label{

    border-radius:12px;
    cursor:pointer;
    background:white;
}

button{

    background:#1667c0;

    padding:18px;
    border-radius:15px;

const params = new URLSearchParams(window.location.search);

const guestName =
(params.get("guest") || "")
.trim()
.toLowerCase();

let data = null;

/* direct search */
if(guests[guestName]){
    data = guests[guestName];
}

/* search all companion names */
if(!data){

    for(const key in guests){

        const invitation = guests[key];

        const found =
        invitation.companions.some(person => {

            const fullName =
            person.toLowerCase().trim();

            const words =
            fullName.split(/\s+/);

const firstName = words[0];

return (
    firstName === guestName ||
    fullName === guestName
);


        });

        if(found){
            data = invitation;
            break;
        }

    }

}

if(data){

    document.getElementById("reservedCount").innerHTML =
    data.companions.length;

    let guestHtml = "";

    data.companions.forEach((person,index)=>{

        guestHtml += `
        <div class="guest">
        ${index + 1}. ${person}
        </div>
        `;

    });

    document.getElementById("guestList").innerHTML =
    guestHtml;

    let checkboxes = "";

    data.companions.forEach(person=>{

        checkboxes += `
        <label>
            <input type="checkbox" value="${person}">
            ${person}
        </label>
        `;

    });

    document.getElementById("checkboxes").innerHTML =
    checkboxes;

}else{

    alert("Invitation not found.");
    window.location.href="index.html";

}

async function submitRSVP(){

    const attendance =
    document.getElementById("attendance").value;

    if(!attendance){

        alert("Please select attendance.");
        return;

    }

    const selectedGuests = [];

    document
    .querySelectorAll(
        '#checkboxes input[type="checkbox"]:checked'
    )
    .forEach(item => {

        selectedGuests.push(
            item.value
        );

    });

    try{

await fetch(
"https://script.google.com/macros/s/AKfycbwgG4seCoh9iaFLsyH_WD7wU6TqzUtCySuLloLETAg-u6a82SpXE7NNGSOIlV5W_gw6/exec",
{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
        guest: guestName,
        attendance: attendance,
        attendees: selectedGuests
    })
});

alert(
`🎉 Thank you for your RSVP!

Response: ${attendance}

Guests Attending:
${selectedGuests.join(", ") || "None"}`
);

}catch(error){

    alert(error);

    console.error(error);

}

}
