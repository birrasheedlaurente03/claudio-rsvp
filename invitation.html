function submitRSVP(){

let response =
document.getElementById("attendance").value;

if(!response){

alert("Please select attendance.");
return;

}

let selectedGuests = [];

document
.querySelectorAll('#checkboxes input[type="checkbox"]:checked')
.forEach(cb => {

selectedGuests.push(cb.value);

});

alert(
"Thank you for your RSVP!\n\nResponse: "
+ response +
"\nGuests Attending: "
+ selectedGuests.join(", ")
);

}
