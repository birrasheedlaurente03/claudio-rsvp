<!DOCTYPE html>
<html>
<body>

<script>

const guests = {

"marco":{
companions:[
"Marco Ayrton Medinacelli",
"Aila Abulencia"
]
},

"gian":{
companions:[
"Gian Carlo Bonto",
"Austine Timkang",
"Jacob Bonto"
]
}

};

const search = "aila";

let data = guests[search];

if(!data){

for(const key in guests){

const invitation = guests[key];

const found = invitation.companions.some(person => {

return (
person.toLowerCase() === search ||
person.split(" ")[0].toLowerCase() === search
);

});

if(found){
data = invitation;
break;
}

}

}

console.log(data);

</script>

</body>
</html>
