<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matmat's 1st Birthday RSVP</title>

<style>

body{
    margin:0;
    background:#eef5fb;
    font-family:Georgia, serif;
    padding:12px;
}

.container{
    max-width:560px;
    margin:10px auto;
    background:white;
    border-radius:32px;
    padding:25px 20px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.dino{
    text-align:center;
    margin-bottom:8px;
}

.dino img{
    width:95px;
    height:auto;
    display:block;
    margin:auto;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.15));
    transition:.3s ease;
}

.dino img:hover{
    transform:scale(1.05);
}

h1{
    text-align:center;
    color:#123e80;
    font-size:30px;
    line-height:1.1;
    margin:0;
}

.rsvp{
    text-align:center;
    font-size:42px;
    color:#1657a8;
    margin:10px 0 5px;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    color:#98a2b3;
    font-size:14px;
    margin-bottom:18px;
}

.note{
    background:#f2f8ff;
    border:1px solid #dce9f8;
    border-radius:18px;
    padding:18px;
    text-align:center;
    line-height:1.6;
    color:#7084a3;
    font-style:italic;
    font-size:15px;
    margin-bottom:22px;
}

label{
    display:block;
    color:#27436e;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:8px;
    font-size:13px;
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
    opacity:.5;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:18px 18px 18px 50px;
    border:1px solid #d8e3f1;
    border-radius:18px;
    font-size:16px;
    background:white;
    transition:.25s;
}

input:focus{
    outline:none;
    border-color:#1657a8;
    box-shadow:0 0 0 4px rgba(22,87,168,.1);
}

button{
    width:100%;
    margin-top:18px;
    border:none;
    background:#1767bf;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
    letter-spacing:3px;
    cursor:pointer;
    font-family:Georgia, serif;
    font-weight:bold;
    transition:.25s;
}

button:hover{
    background:#1256a0;
    transform:translateY(-2px);
}

button:disabled{
    background:#7da7d8;
    cursor:not-allowed;
    transform:none;
}

.search-note{
    text-align:center;
    font-size:12px;
    color:#8a8a8a;
    margin-top:10px;
}

@media (max-width:430px){

    body{
        padding:8px;
    }

    .container{
        padding:18px 14px;
        border-radius:26px;
    }

    .dino img{
        width:80px;
    }

    h1{
        font-size:24px;
    }

    .rsvp{
        font-size:34px;
        margin:8px 0 4px;
    }

    .subtitle{
        margin-bottom:12px;
    }

    .note{
        padding:14px;
        font-size:13px;
        margin-bottom:16px;
    }

    label{
        margin-bottom:6px;
    }

    input{
        padding:14px 14px 14px 45px;
        font-size:15px;
    }

    button{
        padding:14px;
        font-size:16px;
        margin-top:14px;
    }

    .search-note{
        margin-top:8px;
        font-size:11px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="dino">
    <img src="birthday.png" alt="Matmat Birthday Dinosaur">
</div>

<h1>
Matmat's<br>
1st Birthday
</h1>

<div class="rsvp">
RSVP
</div>

<div class="note">
Your presence is the greatest gift.
<br><br>
Kindly confirm your attendance below.
</div>

<label>GUEST NAME</label>

<div class="search-wrapper">

<span class="search-icon">🔍</span>

<input
id="guestName"
type="text"
placeholder="Enter your first name">

</div>

<button id="searchBtn" onclick="findGuest()">
SEARCH
</button>

<p class="search-note">
Please enter the name shown on your invitation.
</p>

</div>

<script>

window.onload = () => {
    document.getElementById("guestName").focus();
};

document
.getElementById("guestName")
.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        findGuest();
    }
});

function findGuest(){

    let guest =
    document.getElementById("guestName").value.trim();

    if(!guest){
        alert("Please enter your name.");
        return;
    }

    const btn =
    document.getElementById("searchBtn");

    btn.disabled = true;
    btn.innerHTML = "SEARCHING...";

    window.location.href =
    "invitation.html?guest=" +
    encodeURIComponent(guest);
}

</script>

</body>
</html>
