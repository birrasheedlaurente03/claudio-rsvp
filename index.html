<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claudio's 1st Birthday RSVP</title>

<style>

body{
    margin:0;
    background:#eef5fb;
    font-family:Georgia, serif;
    padding:20px;
}

.container{
    max-width:560px;
    margin:25px auto;
    background:white;
    border-radius:40px;
    padding:45px 30px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.dino{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#123e80;
    font-size:38px;
    line-height:1.15;
    margin:0;
}

.rsvp{
    text-align:center;
    font-size:56px;
    color:#1657a8;
    margin:25px 0 10px;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    color:#98a2b3;
    font-size:15px;
    margin-bottom:30px;
}

.note{
    background:#f2f8ff;
    border:1px solid #dce9f8;
    border-radius:22px;
    padding:28px;
    text-align:center;
    line-height:1.8;
    color:#7084a3;
    font-style:italic;
    font-size:17px;
    margin-bottom:35px;
}

label{
    display:block;
    color:#27436e;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:10px;
    font-size:14px;
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
    opacity:.5;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:22px 22px 22px 55px;
    border:1px solid #d8e3f1;
    border-radius:20px;
    font-size:18px;
    background:white;
    transition:.25s;
}

input:focus{
    outline:none;
    border-color:#1657a8;
    box-shadow:0 0 0 4px rgba(22,87,168,.1);
}

button{
    width:100%;
    margin-top:25px;
    border:none;
    background:#1767bf;
    color:white;
    padding:22px;
    border-radius:20px;
    font-size:20px;
    letter-spacing:3px;
    cursor:pointer;
    font-family:Georgia, serif;
    transition:.25s;
}

button:hover{
    background:#1256a0;
    transform:translateY(-2px);
}

button:disabled{
    background:#7da7d8;
    cursor:not-allowed;
    transform:none;
}

.search-note{
    text-align:center;
    font-size:13px;
    color:#8a8a8a;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="dino">🦖</div>

<h1>
Claudio's<br>
1st Birthday
</h1>

<div class="rsvp">
RSVP
</div>

<p class="subtitle">
The favour of your reply is requested
</p>

<div class="note">
Every seat is reserved with love and intention.
<br><br>
Kindly confirm your attendance below.
</div>

<label>GUEST NAME</label>

<div class="search-wrapper">

<span class="search-icon">🔍</span>

<input
id="guestName"
type="text"
placeholder="Type your first name">

</div>

<button id="searchBtn" onclick="findGuest()">
SEARCH
</button>

<p class="search-note">
Search using the name printed on your invitation.
</p>

</div>

<script>

window.onload = () => {
    document.getElementById("guestName").focus();
};

document
.getElementById("guestName")
.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        findGuest();
    }
});

function findGuest(){

    let guest =
    document.getElementById("guestName").value.trim();

    if(!guest){
        alert("Please enter your name.");
        return;
    }

    const btn =
    document.getElementById("searchBtn");

    btn.disabled = true;
    btn.innerHTML = "SEARCHING...";

    window.location.href =
    "invitation.html?guest=" +
    encodeURIComponent(guest);
}

</script>

</body>
</html>
