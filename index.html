<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claudio's 1st Birthday RSVP</title>

<style>

body{
    margin:0;
    background:#eef5fb;
    font-family:Georgia, serif;
}

.container{
    max-width:500px;
    margin:30px auto;
    background:white;
    border-radius:30px;
    padding:40px 25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#123e80;
    font-size:48px;
    margin-bottom:10px;
}

.rsvp{
    text-align:center;
    font-size:70px;
    color:#1657a8;
    margin:15px 0;
}

.subtitle{
    text-align:center;
    color:#999;
}

.note{
    background:#f1f8ff;
    padding:25px;
    border-radius:20px;
    margin:30px 0;
    text-align:center;
    color:#6f7d97;
    font-style:italic;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
    letter-spacing:2px;
    color:#27436e;
}

input{
    width:100%;
    padding:20px;
    border:1px solid #d8e3f1;
    border-radius:18px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    border:none;
    background:#1667c0;
    color:white;
    padding:22px;
    border-radius:18px;
    font-size:28px;
    cursor:pointer;
}

button:hover{
    background:#1256a0;
}

</style>
</head>

<body>

<div class="container">

<h1>
🦖<br>
Claudio's<br>
1st Birthday
</h1>

<div class="rsvp">
RSVP
</div>

<p class="subtitle">
The favour of your reply is requested
</p>

<div class="note">
Every seat is reserved with love and intention.<br><br>
Kindly confirm your attendance below.
</div>

<label>GUEST NAME</label>

<input
id="guestName"
placeholder="Enter your full name as written on the invitation">

<button onclick="findGuest()">
SEARCH
</button>

</div>

<script>

function findGuest(){

let guest =
document.getElementById("guestName").value;

if(!guest){
alert("Please enter your name.");
return;
}

window.location.href =
"invitation.html?guest="
+ encodeURIComponent(guest);

}

</script>

</body>
</html>
